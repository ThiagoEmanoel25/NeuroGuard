# Só o Postgres: o gateway roda local com `go run .` durante o desenvolvimento.
# ponytail: sem Dockerfile do app ainda — adicionar quando houver deploy.
services:
  postgres:
    image: postgres:16-alpine
    container_name: neuroguard-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neuroguard
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Sem isso, `docker compose up -d` retorna antes do banco aceitar conexão
      # e o gateway falha no Ping da primeira execução.
      test: ["CMD-SHELL", "pg_isready -U postgres -d neuroguard"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
